# Parked CI workflow: move to .github/workflows/ci.yml (needs a GitHub credential with the `workflow` scope). See handoff.md §7.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:validate
      - run: pnpm content:build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    # Playwright only on PRs into main (§3.5).
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
