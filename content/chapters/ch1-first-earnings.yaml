# yaml-language-server: $schema=../../packages/content/dist/schemas/chapter.schema.json
# Chapter 1 — First Earnings. Turns are months (12 turns = one year, ages 18–21).
# Small amounts, big habits: budgeting, a first safety jar and spotting "pay to win" scams.
# Amounts are illustrative; balance checked with `pnpm sim -- --chapter ch1-first-earnings`.
version: 1
id: ch1-first-earnings
enabled: true
order: 1
title: { en: "First Earnings" }
scene: campus
ageRange: [18, 21]
stage: { en: "Student" }
turnUnit: month
turns: 12
startingBalance: 2000
income:
  label: { en: "Stipend and part-time pay" }
  amountPerMonth: 6000
  growthPerYear: 0
fixedExpenses:
  - id: travel-snacks
    label: { en: "Travel and snacks" }
    amountPerMonth: 2500
    inflationAdjusted: false
    icon: bus
tasks:
  - id: ch1-phone-bill
    title: { en: "Phone bill" }
    shortTitle: { en: "Phone bill" }
    kind: need
    amount: 300
    dueTurn: 1
    required: true
    lateFine: 100
    pillar: plan-budget
    icon: smartphone
  - id: ch1-college-fee-share
    title: { en: "Your share of college fees" }
    shortTitle: { en: "College fees" }
    kind: need
    amount: 8000
    dueTurn: 6
    required: true
    lateFine: 500
    pillar: plan-budget
    icon: graduation-cap
  - id: ch1-friend-birthday
    title: { en: "Friend's birthday gift" }
    shortTitle: { en: "Birthday gift" }
    kind: want
    amount: 500
    dueTurn: 3
    required: false
    pillar: plan-budget
    icon: gift
  - id: ch1-save-phone
    title: { en: "Save for a new phone" }
    shortTitle: { en: "New phone" }
    kind: goal
    amount: 12000
    dueTurn: 12
    required: false
    pillar: plan-budget
    icon: smartphone
  - id: ch1-safety-jar
    title: { en: "Start a safety jar" }
    shortTitle: { en: "Safety jar" }
    kind: safety
    amount: 3000
    dueTurn: 6
    required: true
    pillar: save-manage
    icon: piggy-bank
unlockOptions: [cash, savings, rd]
lifeEventPool:
  # Probabilities are per MONTH here, so the yearly-tuned events are scaled down.
  - { eventId: scholarship }
  - { eventId: festival-gift }
  - { eventId: phone-broken, weight: 0.25 }
  - { eventId: bike-repair }
scamPool: [prize-fee-message, job-fee-offer]
auctionIds: []
next: ch2-first-job
intro:
  en: "Your first money of your own! A stipend and part-time work bring in ₹6,000 a month. Small amounts — but the habits you build now last a lifetime."
outro:
  en: "A year of first earnings is done. Let's see what habits you built."
discussionPromptIds: [ch1-prompt-needs-wants, ch1-prompt-safety-jar, ch1-prompt-prize-scam]
